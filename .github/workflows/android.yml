name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: magpie-core/go.mod
          cache-dependency-path: magpie-core/go.sum
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Configure ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD and ANDROID_KEY_PASSWORD in repository Actions secrets.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing.jks"
      - name: Compile and sign APK
        env:
          TARGET_ABI: ${{ matrix.abi }}
          MAGPIE_KEYSTORE: ${{ runner.temp }}/android-signing.jks
          MAGPIE_STOREPASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MAGPIE_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAGPIE_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'magpie' }}
        run: bash android/build.sh
      - name: Verify bundled runtime
        run: |
          source android/version.properties
          case '${{ matrix.abi }}' in arm64-v8a) label=arm64 ;; x86_64) label=x86_64 ;; esac
          python3 android/tests/plugin_package_test.py "dist/Magpie-Android-$ANDROID_VERSION-$label.apk" '${{ matrix.abi }}'
          sha256sum dist/*.apk > dist/SHA256SUMS-${{ matrix.abi }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-android-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing.jks"

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: magpie-android-*
          path: dist
          merge-multiple: true
      - name: Publish APK files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source android/version.properties
          test "$GITHUB_REF_NAME" = "android-v$ANDROID_VERSION"
          printf 'Android %s / Magpie core %s\n\nInstall the arm64 APK on ARM64 phones. See android/VERIFICATION.md for the tested scope.\n' "$ANDROID_VERSION" "$CORE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS-*.txt --title "Magpie Android $ANDROID_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
